name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Getting GitHub code frequency..."

          for i in {1..10}; do
            echo "Attempt $i/10..."

            STATUS=$(curl -s -o stats-response.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/Joy-Zwarts/Joy-Zwarts.github.io/stats/code_frequency")

            echo "GitHub response: $STATUS"

            if [ "$STATUS" = "200" ]; then
              break
            fi

            if [ "$STATUS" = "202" ]; then
              echo "GitHub is still calculating statistics. Waiting 30 seconds..."
              sleep 30
              continue
            fi

            echo "GitHub API returned an unexpected status:"
            cat stats-response.json
            exit 1
          done

          if [ "$STATUS" != "200" ]; then
            echo "GitHub did not return statistics after 10 attempts."
            cat stats-response.json
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("stats-response.json") as f:
              data = json.load(f)

          if not isinstance(data, list) or not data:
              raise Exception("GitHub returned empty statistics")

          last_week = data[-1]

          stats = {
              "additions": last_week[1],
              "deletions": abs(last_week[2])
          }

          with open("github-stats.json", "w") as f:
              json.dump(stats, f, indent=2)

          print("Generated github-stats.json:")
          print(json.dumps(stats, indent=2))
          PY

          rm stats-response.json

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stats"
            git push
          fi
