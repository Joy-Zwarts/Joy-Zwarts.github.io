name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching commits..."

          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repo = "Joy-Zwarts/Joy-Zwarts.github.io"

          since = datetime.now(timezone.utc) - timedelta(days=7)

          url = (
              f"https://api.github.com/repos/{repo}/commits"
              f"?since={since.isoformat()}&per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )

          with urllib.request.urlopen(request) as response:
              commits = json.load(response)

          additions = 0
          deletions = 0

          for commit in commits:
              sha = commit["sha"]

              detail_url = f"https://api.github.com/repos/{repo}/commits/{sha}"

              request = urllib.request.Request(
                  detail_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  details = json.load(response)

              stats = details.get("stats", {})

              additions += stats.get("additions", 0)
              deletions += stats.get("deletions", 0)

          result = {
              "additions": additions,
              "deletions": deletions
          }

          print(json.dumps(result, indent=2))

          with open("github-stats.json", "w") as f:
              json.dump(result, f, indent=2)

          PY

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub stats"
            git push
          fi
