<!DOCTYPE html>

<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <title>Joy Zwarts - Contact</title>
        <meta name="description" content="Portfolio van Joy Zwarts - Blog.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <header>
            <nav>
                <a href="index.html">
                    <img src="indexImages/homeButton.png" alt="Home" class="buttons">
                </a>
                <img src="indexImages/divider.png" alt="">
                <a href="portfolio.html">
                    <img src="indexImages/portfolioButton.png" alt="Portfolio" class="buttons">
                </a>
                <a href="blog.html">
                    <img src="indexImages/blogButton.png" alt="Blog" class="buttons">
                </a>
                <a href="contact.html">
                    <img src="indexImages/contactButton.png" alt="Blog" class="buttons">
                </a>
                <img src="indexImages/tabIcons.png" class="tabIcons" alt="Tab icons">
            </nav>
        </header>

        <main>
            <section class="blurb">
                <div class="pageHeader">
                    <h1>Contact</h1>
                    <img src="contactImages/notification.png" alt="Notification">
                </div>
            </section>
            <form id="contact-form">
                <section class="formTop">
                    <label for="naam">Naam</label>
                    <input id="naam" name="naam" required minlength="2">

                    <label for="email">E-mail</label>
                    <input type="email" id="email" required minlength="2">
                </section>

                <section class="formBottom">
                    <label for="bericht">Bericht</label>
                    <textarea id="bericht" class="bericht" required minlength="20"></textarea>
                    <button type="submit" id="submit">
                        Versturen
                    </button>
                </section>
            </form>
        </main>

        <footer>
            <img src="indexImages/emailIcon.png" alt="" class="footer" aria-hidden="true">
            <a href="mailto:zwartsjoy@gmail.com">
                <img src="indexImages/emailButton.png" alt="Email" class="footer">
            </a>
            <img src="indexImages/footerDivider.png" alt="" class="footer" aria-hidden="true">
            <a href="https://www.linkedin.com/in/joy-zwarts-137976423" target="_blank" rel="noopener noreferrer">
                <img src="indexImages/linkedIn.png" alt="LinkedIn" class="footer">
            </a>
        </footer>
    </body>
</html>
