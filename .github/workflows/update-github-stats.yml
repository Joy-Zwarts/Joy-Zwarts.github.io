name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Joy-Zwarts/Joy-Zwarts.github.io/stats/code_frequency" \
            -o stats-response.json

          python3 <<'PY'
          import json

          with open("stats-response.json") as f:
              data = json.load(f)

          if not isinstance(data, list) or not data:
              raise Exception("GitHub did not return code frequency data")

          last_week = data[-1]

          stats = {
              "additions": last_week[1],
              "deletions": abs(last_week[2])
          }

          with open("github-stats.json", "w") as f:
              json.dump(stats, f, indent=2)

          print(stats)
          PY

          rm stats-response.json

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub stats"
            git push
          fi
